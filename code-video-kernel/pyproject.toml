[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codevideo-production-kernel"
version = "0.3.2"
description = "Evidence-gated actual 3D puppet rigging, film rendering, and MP4 QA"
requires-python = ">=3.11"
readme = "README.md"
authors = [{name = "Stinky Weasel Productions"}]
license = {text = "MIT"}
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
mcp = ["mcp>=2.2,<2.3"]
dev = ["pytest>=8"]
portable-rig = ["numpy>=1.24"]
vtk-demo = ["vtk>=9.3,<10", "pillow>=10", "numpy>=1.24"]

[project.scripts]
codevideo = "codevideo.cli:main"

[tool.setuptools.packages.find]
include = ["codevideo*", "blender*"]
